<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<title>Iniciar sesión</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bsm/tokens.css">
<link rel="stylesheet" href="ds/bsm/components/bundle.css">
<script src="ds/bsm/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--brass-ink)}a:hover{color:var(--ink)}
a.bsm-btn{text-decoration:none}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; box-sizing: border-box; padding: 64px 24px 32px;">
  <div style="display: flex; justify-content: center;">
    <x-import component-from-global-scope="BSM.Logo" variant="horizontal" height="{{logoH}}"></x-import>
  </div>

  <div style="margin-top: 48px; display: flex; flex-direction: column; gap: 6px;">
    <h1 style="margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 32px; line-height: 36px;">Inicia sesión</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--ink-muted);">Ingresa para reservar y gestionar tus citas.</p>
  </div>

  <form style="margin-top: 24px; display: flex; flex-direction: column; gap: 16px;">
    <sc-if value="{{isError}}" hint-placeholder-val="{{no}}">
      <x-import component-from-global-scope="BSM.Banner" tone="danger" title="Correo o contraseña incorrectos">Revísalos e inténtalo de nuevo.</x-import>
    </sc-if>
    <x-import component-from-global-scope="BSM.Input" label="Correo electrónico" type="email" icon="mail" default-value="andres.gomez@correo.co" autocomplete="email"></x-import>
    <x-import component-from-global-scope="BSM.Input" label="Contraseña" revealable="{{yes}}" default-value="barberia26" autocomplete="current-password"></x-import>
    <a href="#recuperar" style="align-self: flex-end; font-size: 14px; line-height: 20px; font-weight: 600; padding: 4px 0;">¿Olvidaste tu contraseña?</a>
    <a href="Inicio.dc.html" class="bsm-btn bsm-btn-primary bsm-btn-lg bsm-btn-block" style="margin-top: 8px;">Entrar</a>
  </form>

  <p style="margin: auto 0 0; text-align: center; font-size: 15px; line-height: 22px; color: var(--ink-muted);">¿No tienes cuenta? <a href="Registro.dc.html" style="font-weight: 600;">Crear cuenta</a></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Vista"},"estado":{"editor":"enum","options":["normal","error"],"default":"normal","section":"Vista"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.dark ? 'dark' : 'light',
      yes: true, no: false, logoH: 48,
      isError: (this.props.estado ?? 'normal') === 'error'
    };
  }
}
</script>
</body>
</html>
