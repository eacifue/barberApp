<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<title>Panel · Agenda · Semana</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bsm/tokens.css">
<link rel="stylesheet" href="ds/bsm/components/bundle.css">
<script src="ds/bsm/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--brass-ink)}a:hover{color:var(--ink)}
a.bsm-btn,a.bsm-tab,a.bsm-iconbtn,a.bsm-agenda-item{text-decoration:none}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 1120px; position: relative; display: flex; flex-wrap: wrap; align-items: stretch; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
  <div style="flex: 0 0 264px; display: flex;">
    <x-import component-from-global-scope="BSM.Sidebar" active="Agenda" sections="{{sections}}" user="{{user}}"></x-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
    <x-import component-from-global-scope="BSM.Topbar" title="Agenda" unread="{{yes}}" theme="{{theme}}"></x-import>

    <div style="padding: 24px 24px 32px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 4px;">
          <x-import component-from-global-scope="BSM.IconButton" icon="chevron-left" label="Semana anterior" variant="secondary" size="sm"></x-import>
          <x-import component-from-global-scope="BSM.Button" variant="secondary" size="sm">Esta semana</x-import>
          <x-import component-from-global-scope="BSM.IconButton" icon="chevron-right" label="Semana siguiente" variant="secondary" size="sm"></x-import>
        </div>
        <h2 style="margin: 0 0 0 4px; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 30px;">2 – 8 de noviembre</h2>
        <div style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
          <nav class="bsm-tabs bsm-tabs-segmented" aria-label="Vista de la agenda">
            <a class="bsm-tab" href="Main.dc.html">Día</a>
            <a class="bsm-tab is-active" aria-current="page" href="Agenda-semana.dc.html">Semana</a>
            <a class="bsm-tab" href="Agenda-historial.dc.html">Historial</a>
          </nav>
          <a href="Agenda-nueva-cita.dc.html" class="bsm-btn bsm-btn-primary bsm-btn-md">
            <x-import component-from-global-scope="BSM.Icon" name="plus" size="20"></x-import>
            Nueva cita
          </a>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
        <div style="width: 240px;">
          <x-import component-from-global-scope="BSM.Select" aria-label="Barbero de la semana" options="{{barberOpts}}"></x-import>
        </div>
        <span style="font-size: 14px; line-height: 20px; color: var(--ink-muted);">La vista Semana muestra un barbero a la vez.</span>
        <span style="margin-left: auto; font-size: 14px; line-height: 20px; color: var(--ink-muted); font-variant-numeric: tabular-nums;">35 citas esta semana · 2 canceladas · 2 no asistieron</span>
      </div>

      <x-import component-from-global-scope="BSM.AgendaBoard" start="09:00" end="20:00" now="11:20" px-per-min="{{scale}}" barbers="{{days}}"></x-import>
    </div>
  </main>
</div>
</x-dc>
