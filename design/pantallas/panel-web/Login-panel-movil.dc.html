<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<title>Panel en celular · Iniciar sesión</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bsm/tokens.css">
<link rel="stylesheet" href="ds/bsm/components/bundle.css">
<script src="ds/bsm/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--brass-ink)}a:hover{color:var(--ink)}
a.bsm-btn{text-decoration:none}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column;">
  <header data-theme="dark" style="background: var(--carbon); color: var(--ink); padding: 32px 24px 28px; display: flex; flex-direction: column; gap: 16px;">
    <x-import component-from-global-scope="BSM.Logo" variant="horizontal" surface="dark" height="{{logoH}}"></x-import>
    <p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted);">Agenda, clientes y equipo en un solo lugar.</p>
  </header>

  <form style="padding: 28px 24px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px;">
      <h1 style="margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 32px;">Panel de la barbería</h1>
      <p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--ink-muted);">Ingresa con tu cuenta administrativa.</p>
    </div>
    <x-import component-from-global-scope="BSM.Input" label="Correo electrónico" type="email" icon="mail" default-value="camila.arango@correo.co" autocomplete="username"></x-import>
    <x-import component-from-global-scope="BSM.Input" label="Contraseña" revealable="{{yes}}" default-value="recepcion2026" autocomplete="current-password"></x-import>
    <a href="#recuperar" style="align-self: flex-end; font-size: 14px; line-height: 20px; font-weight: 600; padding: 4px 0;">¿Olvidaste tu contraseña?</a>
    <a href="Dashboard-movil.dc.html" class="bsm-btn bsm-btn-primary bsm-btn-lg bsm-btn-block">Entrar al panel</a>
  </form>

  <div style="margin-top: auto; padding: 0 24px 28px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <span style="font-size: 14px; line-height: 20px; color: var(--ink-muted);">Tema</span>
    <x-import component-from-global-scope="BSM.Tabs" variant="segmented" label="Tema" value="{{theme}}" items="{{themeItems}}"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Vista"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.dark ? 'dark' : 'light',
      yes: true, logoH: 40,
      themeItems: [{ value: 'light', label: 'Claro', icon: 'sun' }, { value: 'dark', label: 'Oscuro', icon: 'moon' }]
    };
  }
}
</script>
</body>
</html>
