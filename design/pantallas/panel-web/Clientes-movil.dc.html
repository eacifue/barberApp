<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<title>Panel en celular · Clientes</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bsm/tokens.css">
<link rel="stylesheet" href="ds/bsm/components/bundle.css">
<script src="ds/bsm/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--brass-ink)}a:hover{color:var(--ink)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column;">
  <x-import component-from-global-scope="BSM.Topbar" compact="{{yes}}" placeholder="Buscar" unread="{{yes}}" theme="{{theme}}"></x-import>

  <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <div style="display: flex; flex-direction: column;">
        <h1 style="margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 32px;">Clientes</h1>
        <span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">342 clientes · 27 nuevos este mes</span>
      </div>
      <x-import component-from-global-scope="BSM.IconButton" icon="user-plus" label="Nuevo cliente" variant="secondary"></x-import>
    </div>
    <x-import component-from-global-scope="BSM.Input" icon="search" placeholder="Nombre, correo o celular" aria-label="Buscar cliente"></x-import>
    <div role="group" aria-label="Filtrar por estado" style="display: flex; gap: 8px;">
      <x-import component-from-global-scope="BSM.Chip" selected="{{yes}}">Todos</x-import>
      <x-import component-from-global-scope="BSM.Chip">Activos</x-import>
      <x-import component-from-global-scope="BSM.Chip">Inactivos</x-import>
    </div>
  </div>

  <ul aria-label="Clientes" style="list-style: none; margin: 12px 16px 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); overflow: hidden;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
      <li style="display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; border-top: {{r.border}};">
        <x-import component-from-global-scope="BSM.Avatar" name="{{r.name}}" size="{{s40}}"></x-import>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
          <span style="display: flex; align-items: center; gap: 6px;">
            <strong style="font-size: 15px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.name}}</strong>
            <sc-if value="{{r.inactive}}" hint-placeholder-val="{{no}}"><x-import component-from-global-scope="BSM.Badge" tone="neutral">Inactivo</x-import></sc-if>
          </span>
          <span style="font-size: 13px; line-height: 18px; color: var(--ink-muted); font-variant-numeric: tabular-nums;">{{r.phone}} · {{r.summary}}</span>
        </span>
        <span style="display: flex; color: var(--ink-muted);"><x-import component-from-global-scope="BSM.Icon" name="chevron-right" size="20"></x-import></span>
      </li>
    </sc-for>
  </ul>

  <div style="padding: 12px 16px 0; display: flex; justify-content: center;">
    <x-import component-from-global-scope="BSM.Button" variant="ghost" size="sm" icon="chevron-down">Cargar más</x-import>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 16px;">
    <x-import component-from-global-scope="BSM.BottomNav" floating="{{yes}}" active="Clientes" items="{{nav}}"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Vista"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (name, phone, total, last, active, i) => ({
      name, phone, inactive: !active, border: i === 0 ? 'none' : '1px solid var(--line)',
      summary: total === 0 ? 'Sin visitas' : total + (total === 1 ? ' cita' : ' citas') + ' · ' + last
    });
    return {
      theme: this.props.dark ? 'dark' : 'light',
      yes: true, no: false, s40: 40,
      nav: [{ icon: 'layout-dashboard', label: 'Inicio' }, { icon: 'calendar-days', label: 'Agenda' }, { icon: 'users', label: 'Clientes' }, { icon: 'menu', label: 'Más' }],
      rows: [
        row('Andrés Gómez', '300 123 4567', 14, 'hoy', true, 0),
        row('Felipe Zapata', '320 888 1200', 3, 'hoy', true, 1),
        row('Valentina Ríos', '312 908 3344', 4, '5 nov', true, 2),
        row('Laura Henao', '311 555 0192', 6, '2 nov', true, 3),
        row('Tomás Cardona', '315 410 2290', 9, '2 nov', true, 4),
        row('Juan Pablo Ríos', '310 555 0187', 6, '9 oct', true, 5),
        row('Mario Echeverri', '318 222 0101', 0, '', false, 6)
      ]
    };
  }
}
</script>
</body>
</html>
