<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<title>Panel en celular · Agenda</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bsm/tokens.css">
<link rel="stylesheet" href="ds/bsm/components/bundle.css">
<script src="ds/bsm/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--brass-ink)}a:hover{color:var(--ink)}
a.bsm-agenda-item{text-decoration:none}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column;">
  <x-import component-from-global-scope="BSM.Topbar" compact="{{yes}}" placeholder="Buscar" unread="{{yes}}" theme="{{theme}}"></x-import>

  <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <h1 style="margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 32px;">Agenda</h1>
      <x-import component-from-global-scope="BSM.Button" size="sm" icon="plus">Nueva cita</x-import>
    </div>
    <div style="display: flex; align-items: center; gap: 4px;">
      <x-import component-from-global-scope="BSM.IconButton" icon="chevron-left" label="Día anterior" size="sm"></x-import>
      <span style="flex: 1; text-align: center; font-size: 15px; line-height: 20px; font-weight: 600;">Hoy · viernes 6 de noviembre</span>
      <x-import component-from-global-scope="BSM.IconButton" icon="chevron-right" label="Día siguiente" size="sm"></x-import>
    </div>
    <div role="group" aria-label="Barbero" style="display: flex; gap: 8px; overflow: hidden;">
      <x-import component-from-global-scope="BSM.Chip" selected="{{yes}}" count="{{n8}}">Julián</x-import>
      <x-import component-from-global-scope="BSM.Chip" count="{{n6}}">Mateo</x-import>
      <x-import component-from-global-scope="BSM.Chip" count="{{n5}}">Santiago</x-import>
      <x-import component-from-global-scope="BSM.Chip" count="{{n4}}">Sebastián</x-import>
    </div>
    <x-import component-from-global-scope="BSM.AgendaBoard" start="09:00" end="15:00" now="11:20" px-per-min="{{scale}}" barbers="{{barbers}}"></x-import>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 16px;">
    <x-import component-from-global-scope="BSM.BottomNav" floating="{{yes}}" active="Agenda" items="{{nav}}"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Vista"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const c = (client, service, start, end, status) => ({ client, service, start, end, status });
    return {
      theme: this.props.dark ? 'dark' : 'light',
      yes: true, n4: 4, n5: 5, n6: 6, n8: 8, scale: 1.05,
      nav: [{ icon: 'layout-dashboard', label: 'Inicio' }, { icon: 'calendar-days', label: 'Agenda' }, { icon: 'users', label: 'Clientes' }, { icon: 'menu', label: 'Más' }],
      barbers: [{ name: 'Julián Restrepo', count: 8, items: [
        c('Andrés Gómez', 'Corte + barba', '09:00', '09:50', 'Completada'),
        c('Laura Henao', 'Corte clásico', '10:00', '10:30', 'NoShow'),
        c('Felipe Zapata', 'Afeitado', '11:00', '11:30', 'EnProgreso'),
        c('Juan Pablo Ríos', 'Corte + barba', '11:30', '12:20', 'Confirmada'),
        { block: true, client: 'Almuerzo', start: '12:30', end: '13:30' },
        c('Tomás Cardona', 'Corte clásico', '14:00', '14:30', 'Confirmada')] }]
    };
  }
}
</script>
</body>
</html>
